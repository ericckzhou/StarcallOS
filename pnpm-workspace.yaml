packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 11 gates native postinstall build scripts behind this explicit allow
# map. electron (downloads its binary) and esbuild (installs its binary) MUST
# be allowed or `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS in CI.
allowBuilds:
  electron: true
  esbuild: true
  canvas: false
  # electron-builder 26 pulls in electron-winstaller (Squirrel.Windows installer
  # builder). We ship the portable target, not Squirrel, so its build script is
  # not needed — categorize it as not-built to avoid the CI ERR_PNPM_IGNORED_BUILDS.
  electron-winstaller: false
  # tesseract.js's postinstall only prints an opencollective banner; the OCR
  # engine (WebAssembly) and the English model ship as plain package files.
  tesseract.js: false

# GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: browserslist <=4.28.6 arrives
# transitively via @vitejs/plugin-react > @babel/core (build-time only). The
# floor keeps future 4.x updates flowing; drop it once upstream's own
# resolution is >=4.28.7.
overrides:
  browserslist: ^4.28.7
